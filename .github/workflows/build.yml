name: Windows

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Test, benchmark and package
        shell: pwsh
        run: ./scripts/build.ps1 -Archive -Setup
      - name: Upload Windows test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SuperMenu-test-results
          path: artifacts/test-results/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: SuperMenu-windows-x64
          path: |
            artifacts/SuperMenu-windows-x64.zip
            artifacts/SuperMenu-Setup-x64.exe
            artifacts/SuperMenu/supermenu.exe
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SuperMenu-windows-x64
          path: artifacts
      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $isTag = $env:GITHUB_REF.StartsWith('refs/tags/v')
          if ($isTag) {
              $releaseTag = $env:GITHUB_REF_NAME
              $version = $releaseTag.Substring(1)
          } else {
              $manifest = Get-Content -LiteralPath Cargo.toml -Raw
              $package = [regex]::Match($manifest, '(?ms)^\[package\]\s*(?<body>.*?)(?=^\[|\z)').Groups['body'].Value
              $versionMatch = [regex]::Match($package, '(?m)^version\s*=\s*"([^"]+)"\s*$')
              if (-not $versionMatch.Success) { throw 'Version du paquet Cargo introuvable.' }
              $version = $versionMatch.Groups[1].Value
              $releaseTag = 'v' + $version
          }
          gh release view "$releaseTag" --json url 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
              Write-Host "Release $releaseTag déjà publiée ; ses fichiers restent inchangés."
              exit 0
          }
          if ($isTag) {
              gh release create "$releaseTag" artifacts/SuperMenu-Setup-x64.exe artifacts/SuperMenu-windows-x64.zip artifacts/SuperMenu/supermenu.exe --verify-tag --generate-notes --title "Super Menu $version"
          } else {
              gh release create "$releaseTag" artifacts/SuperMenu-Setup-x64.exe artifacts/SuperMenu-windows-x64.zip artifacts/SuperMenu/supermenu.exe --target "$env:GITHUB_SHA" --prerelease --generate-notes --title "Super Menu $version"
          }
          if ($LASTEXITCODE -ne 0) { throw 'La publication de la release a échoué.' }

[package]
name = "supermenu"
version = "0.6.18"
edition = "2021"
description = "A lightweight native Windows launcher and local indexer"
license = "MIT"
repository = "https://github.com/roukmoute/SuperMenu"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_System_JobObjects", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Time", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_ProcessStatus", "Win32_Networking_WinHttp"] }

[dev-dependencies]
# Reference implementation for the Win32 normalization parity tests only.
unicode-normalization = "0.1"

[profile.release]
# Size-optimized globally; the measured ranking loop keeps its two hot helpers inline.
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
